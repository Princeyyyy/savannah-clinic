name: Auto Deploy to Render (CD)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Cloud
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Trigger Render Deployment via Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment hook..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deployment triggered successfully."

      - name: Fallback notice if Deploy Hook is not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping webhook trigger."
          echo "Note: If your Render Web Service is directly connected to GitHub, Render auto-deploys on push to 'main' automatically!"
